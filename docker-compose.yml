name: gas

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gas}
    ports:
      # Loopback only — never expose the database beyond this machine
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - gas_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Keep the footprint small on an 8 GB dev machine
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]

volumes:
  gas_pgdata:
